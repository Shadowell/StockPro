services:
  postgres:
    image: postgres:16-alpine
    container_name: stockpro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockpro
      POSTGRES_PASSWORD: stockpro
      POSTGRES_DB: stockpro
    ports:
      - "55432:5432"
    volumes:
      - stockpro_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockpro -d stockpro"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stockpro_postgres_data:
